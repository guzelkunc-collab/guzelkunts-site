<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Спасибо за покупку — блокнот «Ностальгия»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#EEE6D8;--paper:#F7F1E6;--ink:#2E2520;--soft:#6F5F52;--line:rgba(110,88,70,.24);--accent:#7A3B32;--accent-deep:#5E2B24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "PT Serif",Georgia,serif;padding:0 16px}
.wrap{max-width:560px;margin:0 auto;padding-block:40px 60px}
.pic{aspect-ratio:3/2;background:url(img/aug-letter.jpg) center/cover;border-radius:3px;margin-bottom:-40px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:30px 24px 28px;margin:0 12px}
h1{font:italic 500 clamp(34px,8vw,44px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
p{margin:0 0 14px}
.soft{color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:2px;background:var(--accent);color:var(--paper);font:15px "PT Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:17px 20px;text-decoration:none;margin:18px 0 10px}
.btn:hover{background:var(--accent-deep)}
.code{font:italic 500 26px/1.2 "Cormorant Garamond",Georgia,serif;color:var(--accent)}
.wait{display:flex;gap:12px;align-items:center;color:var(--soft);font:15px "PT Sans",sans-serif;margin:18px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
a{color:var(--accent)}
</style>
<div class="wrap">
  <div class="pic" aria-hidden="true"></div>
  <div class="card" id="box">
    <h1>Спасибо за покупку!</h1>
    <div class="wait" id="wait"><span class="dot" aria-hidden="true"></span><span>Готовлю Ваш блокнот, это займёт несколько секунд…</span></div>
  </div>
</div>
<script>window.NOSTALGIA_PROD = true; window.NOSTALGIA_API = 'https://script.google.com/macros/s/AKfycby-9wSWZwmca2R4Lxn3bSUmwm0mxClNmUPKBcSS0mSKbJKHs3d8S2d86vTlPmhjaRfp/exec'; window.NOSTALGIA_V = 'p20260918';</script>
<script>
(function(){
  var API = window.NOSTALGIA_API || '';
  var box = document.getElementById('box');
  var order = null;
  try { order = JSON.parse(localStorage.getItem('nostalgia-order') || 'null'); } catch (e) {}
  function letterOnly(){
    box.innerHTML = '<h1>Спасибо за покупку!</h1><p>Письмо с кнопкой «Открыть мой блокнот» придёт на почту, которую Вы указали при оплате, в течение нескольких минут.</p>' +
      '<p class="soft">Если письма нет, проверьте папку «Спам». Если и там нет, напишите мне в <a href="https://t.me/guzelkunts" target="_blank" rel="noopener">Telegram @guzelkunts</a> и пришлите скриншот оплаты.</p>';
  }
  function ready(code){
    try { localStorage.removeItem('nostalgia-order'); } catch (e) {}
    box.innerHTML = '<h1>Ваш блокнот готов</h1><p>Нажмите на кнопку, впишите своё имя, и блокнот станет Вашим.</p>' +
      '<a class="btn" href="./?code=' + encodeURIComponent(code) + '">Открыть мой блокнот</a>' +
      '<p class="soft">Ваш секретный код: <span class="code">' + code + '</span></p>' +
      '<p class="soft">Такое же письмо с кнопкой уже летит Вам на почту. Сохраните его: по этой кнопке блокнот откроется на планшете или компьютере.</p>';
  }
  if (!order || !order.inv || !API){ letterOnly(); return; }
  var tries = 0;
  (function poll(){
    tries++;
    fetch(API + '?action=order&inv=' + encodeURIComponent(order.inv) + '&token=' + encodeURIComponent(order.token))
      .then(function(r){ return r.json(); })
      .then(function(res){ if (res.ok && res.code) ready(res.code); else if (tries < 20) setTimeout(poll, 3000); else letterOnly(); })
      .catch(function(){ if (tries < 20) setTimeout(poll, 3000); else letterOnly(); });
  })();
})();
</script>
</html>
